name: Masaüstü Uygulamasını Derle (Windows/Mac/Linux)

# Ben (bu sandbox) sadece Linux'ta derleyip test edebiliyorum — Windows ve Mac
# derlemeleri gerçek o işletim sistemlerini gerektiriyor. Bu workflow, "vX.Y.Z"
# formatında bir git tag push'landığında GitHub'ın kendi Windows/Mac/Linux
# runner'larında otomatik olarak üç platform için de derleme yapar ve
# sonuçları bir GitHub Release'e ekler — hiçbirinize o işletim sistemlerine
# sahip olmanız gerekmez.
#
# Kullanım:
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}  # istenirse elle de tetiklenebilir (Actions sekmesinden)

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: UretimSatisDefteri-Windows
          - os: macos-latest
            artifact_name: UretimSatisDefteri-macOS
          - os: ubuntu-latest
            artifact_name: UretimSatisDefteri-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bağımlılıkları kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: PyInstaller ile derle
        run: pyinstaller packaging/pyinstaller.spec

      - name: Artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/UretimSatisDefteri/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Artifact'leri zip'le
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$name"
          done

      - name: GitHub Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
          generate_release_notes: true
